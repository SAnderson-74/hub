name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Every schema change has a migration
        run: |
          npx drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::The database schema changed without a migration. Run 'npm run db:generate' and commit the new files in drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi
      - run: npm run build

  # The browser tests run as three jobs side by side: iPhone (WebKit), desktop
  # (Chromium), and the accessibility checks. Each starts its own servers.
  e2e:
    name: Browser tests (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            projects: --project=iphone
            browsers: webkit
          - name: desktop
            projects: --project=desktop
            browsers: chromium
          - name: accessibility
            projects: --project=iphone-a11y --project=desktop-a11y
            browsers: chromium webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run build
      - run: npx playwright test ${{ matrix.projects }}
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # One result under the old name, so a branch rule that requires it keeps working.
  e2e-result:
    name: Browser tests (iPhone + desktop)
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every browser test job passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success

  image:
    name: Container image builds
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
