name: Roll back

# Points :stable at an earlier build. The server picks it up on its next update check.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "7-character build id to go back to (from a sha-xxxxxxx tag)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build id
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::Enter the 7 characters after 'sha-' in the image tag, for example a1b2c3d."
            exit 1
          fi
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move stable
        env:
          SHA: ${{ inputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:stable" "$image:sha-$SHA"
          echo "stable now points to sha-$SHA. The next merge to main moves it forward again." >> "$GITHUB_STEP_SUMMARY"
